name: Native Mac Pilot

on:
  push:
    branches: [codex/mac-ci-pilot]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-mac-reestr-gbo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    if: github.repository == 'milaniumkz/reestr-gbo' && (github.ref == 'refs/heads/codex/mac-ci-pilot' || github.ref == 'refs/heads/main')
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["milanium-mac-arm64", "repo-reestr-gbo"]') || fromJSON('["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 45
    env:
      DATABASE_URL: ""
      REDIS_URL: ""
      OPENAI_API_KEY: ""
      AI_API_KEY: ""
      AI_PROVIDER: stub
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Select installed Mac Node 22
        if: github.event_name != 'pull_request'
        run: |
          echo /opt/homebrew/opt/node@22/bin >> "$GITHUB_PATH"
          /opt/homebrew/opt/node@22/bin/node -e 'if (process.versions.node.split(".")[0] !== "22") process.exit(1)'
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - run: npm test -- --runInBand

  admin:
    if: github.repository == 'milaniumkz/reestr-gbo' && (github.ref == 'refs/heads/codex/mac-ci-pilot' || github.ref == 'refs/heads/main')
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["milanium-mac-arm64", "repo-reestr-gbo"]') || fromJSON('["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: admin
    timeout-minutes: 45
    env:
      DATABASE_URL: ""
      REDIS_URL: ""
      OPENAI_API_KEY: ""
      AI_API_KEY: ""
      AI_PROVIDER: stub
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Select installed Mac Node 22
        if: github.event_name != 'pull_request'
        run: |
          echo /opt/homebrew/opt/node@22/bin >> "$GITHUB_PATH"
          /opt/homebrew/opt/node@22/bin/node -e 'if (process.versions.node.split(".")[0] !== "22") process.exit(1)'
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1

  flutter:
    if: github.repository == 'milaniumkz/reestr-gbo' && (github.ref == 'refs/heads/codex/mac-ci-pilot' || github.ref == 'refs/heads/main')
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["milanium-mac-arm64", "repo-reestr-gbo"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 45
    env:
      DATABASE_URL: ""
      REDIS_URL: ""
      OPENAI_API_KEY: ""
      AI_API_KEY: ""
      AI_PROVIDER: stub
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        if: github.event_name == 'pull_request'
        with:
          flutter-version: "3.41.1"
          channel: stable
          cache: true
      - name: Select installed Mac Flutter
        if: github.event_name != 'pull_request'
        run: |
          echo /Volumes/PD1000/job/flutter/bin >> "$GITHUB_PATH"
          /Volumes/PD1000/job/flutter/bin/flutter --version --machine | python3 -c 'import json,sys; assert json.load(sys.stdin)["frameworkVersion"] == "3.41.1"'
      - run: flutter pub get ${{ github.event_name != 'pull_request' && '--enforce-lockfile' || '' }}
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --pwa-strategy=none --dart-define=API_BASE_URL=https://89-207-255-42.sslip.io/api/v1 --dart-define=APP_MODE=production
