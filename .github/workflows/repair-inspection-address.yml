name: Repair one inspection address from saved GPS
on:
  workflow_dispatch:
    inputs:
      operation:
        required: false
        default: repair
        type: choice
        options: [diagnose, repair]
      certificate_number:
        required: true
        type: string
      expected_address_sha256:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Repair only the matching address and record audit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          OPERATION: ${{ inputs.operation }}
          NUMBER: ${{ inputs.certificate_number }}
          EXPECTED: ${{ inputs.expected_address_sha256 }}
        run: |
          set -euo pipefail
          [[ "$NUMBER" =~ ^[0-9]{1,30}$ && "$EXPECTED" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          server="${DEPLOY_USER:-root}@${DEPLOY_HOST}"
          remote="$(ssh "$server" 'mktemp -d /tmp/reestr-address-repair.XXXXXX')"
          trap 'ssh "$server" "rm -rf -- \"$remote\""' EXIT
          scp ops/repair-inspection-address.cjs "$server:$remote/repair.cjs"
          [[ "$OPERATION" = diagnose || "$OPERATION" = repair ]]
          if [ "$OPERATION" = repair ]; then
            ssh "$server" 'bash /opt/reestr/app/ops/backup-reestr.sh'
          fi
          ssh "$server" "set -a; source /opt/reestr/app/backend/.env; set +a; GITHUB_RUN_ID='$GITHUB_RUN_ID' node '$remote/repair.cjs' '$NUMBER' '$EXPECTED' '$OPERATION'"
