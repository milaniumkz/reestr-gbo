name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        type: string
      operation:
        description: Operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - deploy-services
          - deploy-admin
          - diagnose-members
          - status
          - logs
          - restart
          - rollback
          - inventory-inspection-data
          - purge-inspection-data

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'deploy')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --pwa-strategy=none --dart-define=API_BASE_URL=https://89-207-255-42.sslip.io/api/v1 --dart-define=APP_MODE=production
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Android APK for the production API
        run: |
          flutter build apk --release --build-number="$(date +%s)" --dart-define=API_BASE_URL=https://89-207-255-42.sslip.io/api/v1 --dart-define=APP_MODE=production
          mkdir -p build/web/downloads
          cp build/app/outputs/flutter-apk/app-release.apk build/web/downloads/ersi-gbo.apk
          cd build/web/downloads
          sha256sum ersi-gbo.apk > ersi-gbo.apk.sha256
      - name: Retain downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: ersi-gbo-apk
          path: |
            build/web/downloads/ersi-gbo.apk
            build/web/downloads/ersi-gbo.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy checked commit
        run: |
          bash ops/deploy-production.sh "$(git rev-parse HEAD)"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_DIR: /opt/reestr/app
          PUBLIC_ORIGIN: https://89-207-255-42.sslip.io

      - name: Verify public APK download
        run: |
          curl --fail --show-error --location --retry 3 https://89-207-255-42.sslip.io/downloads/ersi-gbo.apk --output "$RUNNER_TEMP/published-ersi-gbo.apk"
          cmp build/web/downloads/ersi-gbo.apk "$RUNNER_TEMP/published-ersi-gbo.apk"
          echo 'APK: https://89-207-255-42.sslip.io/downloads/ersi-gbo.apk' >> "$GITHUB_STEP_SUMMARY"

  operate:
    permissions:
      contents: read
      statuses: write
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation != 'deploy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Run operation
        run: |
          set -o pipefail
          case "${{ github.event.inputs.operation }}" in
            diagnose-members) bash ops/diagnose-members.sh ;;
            deploy-admin) DEPLOY_COMPONENTS=admin bash ops/deploy-production.sh "$(git rev-parse HEAD)" ;;
            deploy-services) DEPLOY_COMPONENTS=services bash ops/deploy-production.sh "$(git rev-parse HEAD)" ;;
            inventory-inspection-data) bash ops/purge-inspection-data.sh inventory ;;
            purge-inspection-data) bash ops/purge-inspection-data.sh apply ;;
            *) bash ops/remote-operation.sh "${{ github.event.inputs.operation }}" ;;
          esac | tee "$RUNNER_TEMP/operation.log"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_DIR: /opt/reestr/app

      - name: Record data operation result
        if: success() && contains(github.event.inputs.operation, 'inspection-data')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          description="$(python3 - <<'PY'
          import json, os
          rows=[]
          for line in open(os.environ['RUNNER_TEMP']+'/operation.log'):
              try:
                  row=json.loads(line.strip())
                  if isinstance(row,dict) and ('organizations' in row or 'inspectionOrganizations' in row): rows.append(row)
              except ValueError: pass
          if not rows: raise SystemExit('Missing operation counts')
          first,last=rows[0],rows[-1]
          if 'inspectionOrganizations' in last:
              print(f"Deleted IO={first['organizations']}, certificates={first['certificates']}; remaining IO={last['inspectionOrganizations']}, certificates={last['certificates']}; backup verified")
          else:
              print(f"IO={last['organizations']}; certificates={last['certificates']}; inspections={last['inspections']}")
          PY
          )"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context="production-data/${{ github.event.inputs.operation }}" -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent

      - name: Record member diagnostics
        if: success() && github.event.inputs.operation == 'diagnose-members'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          for line in open(os.environ['RUNNER_TEMP']+'/operation.log'):
              try: row=json.loads(line)
              except ValueError: continue
              if row.get('kind') == 'http':
                  description=f"Member HTTP codes={row['codes']}; last={row['last']}"[:140]
              else:
                  description=f"{row['name'][:65]}: members={row['members']}; adds={row['additions']}; distinct={row['distinctAdditions']}; last={str(row['lastAddition'])[:19]}"[:140]
              subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",'-f','state=success','-f',f"context=member-diagnostics/{row['orgId']}",'-f',f'description={description}','--silent'],check=True)
          PYCODE
