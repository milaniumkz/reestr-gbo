name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ (github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[hosted-ci]')) && fromJSON('["ubuntu-latest"]') || fromJSON('["milanium-mac-arm64", "repo-reestr-gbo"]') }}
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 45
    env:
      DATABASE_URL: ""
      REDIS_URL: ""
      OPENAI_API_KEY: ""
      AI_API_KEY: ""
      AI_PROVIDER: stub
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[hosted-ci]')
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Select installed Mac Node 22
        if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[hosted-ci]')
        run: |
          echo /opt/homebrew/opt/node@22/bin >> "$GITHUB_PATH"
          /opt/homebrew/opt/node@22/bin/node -e 'if (process.versions.node.split(".")[0] !== "22") process.exit(1)'
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - run: npm test -- --runInBand

  admin:
    runs-on: ${{ (github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[hosted-ci]')) && fromJSON('["ubuntu-latest"]') || fromJSON('["milanium-mac-arm64", "repo-reestr-gbo"]') }}
    defaults:
      run:
        working-directory: admin
    timeout-minutes: 45
    env:
      DATABASE_URL: ""
      REDIS_URL: ""
      OPENAI_API_KEY: ""
      AI_API_KEY: ""
      AI_PROVIDER: stub
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[hosted-ci]')
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Select installed Mac Node 22
        if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[hosted-ci]')
        run: |
          echo /opt/homebrew/opt/node@22/bin >> "$GITHUB_PATH"
          /opt/homebrew/opt/node@22/bin/node -e 'if (process.versions.node.split(".")[0] !== "22") process.exit(1)'
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1

  flutter:
    runs-on: ${{ (github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[hosted-ci]')) && fromJSON('["ubuntu-latest"]') || fromJSON('["milanium-mac-arm64", "repo-reestr-gbo"]') }}
    timeout-minutes: 45
    env:
      DATABASE_URL: ""
      REDIS_URL: ""
      OPENAI_API_KEY: ""
      AI_API_KEY: ""
      AI_PROVIDER: stub
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[hosted-ci]')
        with:
          flutter-version: "3.41.1"
          channel: stable
          cache: true
      - name: Select installed Mac Flutter
        if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[hosted-ci]')
        run: |
          echo /Volumes/PD1000/job/flutter/bin >> "$GITHUB_PATH"
          /Volumes/PD1000/job/flutter/bin/flutter --version --machine | python3 -c 'import json,sys; assert json.load(sys.stdin)["frameworkVersion"] == "3.41.1"'
      - run: flutter pub get ${{ github.event_name != 'pull_request' && '--enforce-lockfile' || '' }}
      - run: node --test scripts/web_startup.test.cjs scripts/identity_camera_readiness.test.cjs
      - run: python3 scripts/check_localization.py
      - run: python3 scripts/check_public_offer.py
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --pwa-strategy=none --dart-define=API_BASE_URL=/api/v1 --dart-define=APP_MODE=production

  identity-engine:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-docker-action@v4
        with:
          version: v20.10.24
      - name: Build pinned local video models
        run: DOCKER_BUILDKIT=0 docker build -f services/identity/Dockerfile.production -t reestr-identity:test services/identity
      - name: Verify video engine without outbound network
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,noexec,size=256m --memory 768m --cpus 1.5 --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges --entrypoint python reestr-identity:test -m unittest test_engine
      - name: Verify isolated HTTP worker is reachable from host
        run: |
          set -euo pipefail
          docker network create --internal identity-ci-private
          docker run -d --name identity-ci --network identity-ci-private --read-only --tmpfs /tmp:rw,nosuid,noexec,size=256m --memory 768m --cpus 1.5 --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges reestr-identity:test
          trap 'docker logs --tail 20 identity-ci; docker rm -f identity-ci; docker network rm identity-ci-private' EXIT
          worker_ip=$(docker inspect identity-ci --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          for n in $(seq 1 30); do
            if curl -fsS --max-time 3 "http://$worker_ip:8080/health" -o /tmp/identity-health.json; then
              python3 -c 'import json; v=json.load(open("/tmp/identity-health.json")); assert v["ready"] and v["liveness"]'
              exit 0
            fi
            sleep 2
          done
          exit 1

  photo-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/photo/requirements.txt
      - run: pip install -r services/photo/requirements.txt
      - uses: actions/cache@v4
        with:
          path: services/photo/models
          key: photo-model-${{ hashFiles('services/photo/model.json') }}
      - run: python services/photo/download_model.py
      - run: python -m unittest discover -s services/photo -p 'test_*.py'
      - run: bash -n ops/deploy-photo-engine.sh

  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash -n ops/backup-reestr.sh ops/publish-web-only.sh
      - run: python3 scripts/backup_live_storage_test.py

  schema-migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: draft_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: migration_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://draft_test:isolated_test_only@127.0.0.1:5432/migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: node scripts/test-draft-migration.cjs
        env:
          DRAFT_MIGRATION_TEST: isolated-only
      - run: npx prisma migrate deploy
