name: Configure public domain
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate domain configuration
        run: |
          bash -n ops/configure-public-domain.sh
          python3 scripts/render_public_domain_nginx.py ops/nginx-reestr.conf > "$RUNNER_TEMP/ersigbo.conf"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Publish printable observer instruction on the existing website
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          server="${DEPLOY_USER:-root}@${DEPLOY_HOST}"
          remote="$(ssh "$server" 'mktemp -d /tmp/reestr-observer.XXXXXX')"
          trap 'ssh "$server" "rm -rf -- \"$remote\""' EXIT
          scp web/downloads/observer-instruction-ersigbo-a4.pdf web/downloads/observer-instruction-ersigbo-a4.png web/observer-instruction.html "$server:$remote/"
          ssh "$server" "bash -s -- '$remote'" <<'REMOTE'
          set -euo pipefail
          staged="$1"
          APP_DIR=/opt/reestr/app bash /opt/reestr/app/ops/backup-reestr.sh
          root=/opt/reestr/app/build/web
          mkdir -p "$root/downloads"
          for name in observer-instruction-ersigbo-a4.pdf observer-instruction-ersigbo-a4.png; do
            install -m644 "$staged/$name" "$root/downloads/.$name.next"
            mv -f "$root/downloads/.$name.next" "$root/downloads/$name"
          done
          install -m644 "$staged/observer-instruction.html" "$root/.observer-instruction.next.html"
          mv -f "$root/.observer-instruction.next.html" "$root/observer-instruction.html"
          REMOTE
          for name in observer-instruction-ersigbo-a4.pdf observer-instruction-ersigbo-a4.png; do
            curl --fail --silent --show-error "https://89-207-255-42.sslip.io/downloads/$name" -o "$RUNNER_TEMP/$name"
            cmp "web/downloads/$name" "$RUNNER_TEMP/$name"
          done
      - name: Install automatic DNS and HTTPS activation without changing legacy host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          server="${DEPLOY_USER:-root}@${DEPLOY_HOST}"
          remote="$(ssh "$server" 'mktemp -d /tmp/reestr-domain.XXXXXX')"
          trap 'ssh "$server" "rm -rf -- \"$remote\""' EXIT
          ssh "$server" "mkdir -p '$remote/ops' '$remote/scripts'"
          scp ops/configure-public-domain.sh ops/nginx-reestr.conf "$server:$remote/ops/"
          scp scripts/render_public_domain_nginx.py "$server:$remote/scripts/"
          ssh "$server" "bash -s -- '$remote'" <<'REMOTE'
          set -euo pipefail
          staged="$1"
          persistent=/usr/local/lib/reestr-public-domain
          mkdir -p "$persistent/ops" "$persistent/scripts"
          install -m644 "$staged/ops/configure-public-domain.sh" "$persistent/ops/"
          install -m644 "$staged/ops/nginx-reestr.conf" "$persistent/ops/"
          install -m644 "$staged/scripts/render_public_domain_nginx.py" "$persistent/scripts/"
          cat > /etc/systemd/system/reestr-public-domain.service <<'SERVICE'
          [Unit]
          Description=Activate ersigbo.kz HTTPS when public DNS is ready
          After=network-online.target nginx.service
          Wants=network-online.target
          [Service]
          Type=oneshot
          ExecStart=/bin/bash /usr/local/lib/reestr-public-domain/ops/configure-public-domain.sh /usr/local/lib/reestr-public-domain
          TimeoutStartSec=900
          SERVICE
          cat > /etc/systemd/system/reestr-public-domain.timer <<'TIMER'
          [Unit]
          Description=Retry initial ersigbo.kz HTTPS activation until successful
          [Timer]
          OnBootSec=30s
          OnUnitInactiveSec=5min
          AccuracySec=10s
          [Install]
          WantedBy=timers.target
          TIMER
          systemctl daemon-reload
          systemctl enable reestr-public-domain.timer
          # Try immediately; a DNS/ACME delay leaves the timer enabled for retries.
          if systemctl start reestr-public-domain.service; then
            echo 'HTTPS active on ersigbo.kz; legacy website verified'
          else
            systemctl start reestr-public-domain.timer
            echo 'Activation pending; server retries every five minutes. Check journalctl -u reestr-public-domain.service'
          fi
          REMOTE
          echo 'Instruction published; ersigbo.kz HTTPS is active or awaiting DNS with automatic server retries. Legacy links retained.' >> "$GITHUB_STEP_SUMMARY"
