server {
 listen 80;
 server_name tech.89-207-255-42.sslip.io;
 location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 server_name tech.89-207-255-42.sslip.io;
 ssl_certificate /etc/letsencrypt/live/tech.89-207-255-42.sslip.io/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/tech.89-207-255-42.sslip.io/privkey.pem;
 include /etc/letsencrypt/options-ssl-nginx.conf;
 client_max_body_size 2m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 location = / { return 302 /tech/; }
 location /tech/ {
  proxy_pass http://127.0.0.1:3002;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
 location /api/v1/technical/ {
  access_log off;
  proxy_pass http://127.0.0.1:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
 location = /api/v1/auth/recovery/complete {
  access_log off;
  proxy_pass http://127.0.0.1:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
 location / { return 404; }
}
