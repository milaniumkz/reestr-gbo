name: Store preparation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Prepare SSH trust
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Back up, publish policy, and provision review account
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          STORE_REVIEW_PASSWORD: ${{ secrets.STORE_REVIEW_PASSWORD }}
        run: |
          set -euo pipefail
          server="${DEPLOY_USER:-root}@${DEPLOY_HOST}"
          ssh "$server" 'if test -x /usr/local/bin/backup-reestr.sh; then /usr/local/bin/backup-reestr.sh; else /opt/reestr/app/ops/backup-reestr.sh; fi'
          ssh "$server" "install -d -m 700 /tmp/reestr-store-${GITHUB_RUN_ID}"
          trap 'ssh "$server" "rm -rf /tmp/reestr-store-${GITHUB_RUN_ID}"' EXIT
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP+"/review.json",JSON.stringify({password:process.env.STORE_REVIEW_PASSWORD}),{mode:0o600})'
          scp web/privacy.html scripts/provision-store-review.cjs "$RUNNER_TEMP/review.json" "$server:/tmp/reestr-store-${GITHUB_RUN_ID}/"
          ssh "$server" "set -eu; install -m 644 /tmp/reestr-store-${GITHUB_RUN_ID}/privacy.html /opt/reestr/app/build/web/privacy.html; cd /opt/reestr/app/backend; set -a; . ./.env; set +a; node /tmp/reestr-store-${GITHUB_RUN_ID}/provision-store-review.cjs /tmp/reestr-store-${GITHUB_RUN_ID}/review.json"
          curl --fail --silent --show-error https://89-207-255-42.sslip.io/privacy.html | grep -q 'Политика конфиденциальности'
